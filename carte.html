<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azro Mobilier — Carte de visite</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="cat-page carte-body">
  <div class="wood-bg" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar">
    <a class="back-btn" href="index.html">
      <span class="back-arrow">←</span>
      <span id="c-back">Retour</span>
    </a>
    <a class="brand" href="index.html">
      <img class="brand-logo" src="logo.png" alt="Azro Mobilier" />
      <div class="brand-text">
        <span class="brand-name">AZRO MOBILIER</span>
        <span class="brand-tag" id="c-tagline">Pensez Grand · Meublez Pro</span>
      </div>
    </a>
    <nav class="lang-switch" aria-label="Language">
      <button class="lang-btn active" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ar">AR</button>
    </nav>
  </header>

  <main class="carte-main">
    <div class="carte-head">
      <p class="eyebrow" id="c-eyebrow">Carte de visite</p>
      <h1 class="carte-title" id="c-title">Azro Mobilier</h1>
      <p class="carte-sub" id="c-sub">Survolez ou cliquez la carte pour la retourner</p>
    </div>

    <!-- ===== Business card (flip) ===== -->
    <div class="bizcard-stage">
      <div class="bizcard" id="bizcard" role="button" tabindex="0" aria-label="Carte de visite Azro Mobilier">

        <div class="bizcard-face bizcard-front">
          <div class="bc-gloss" aria-hidden="true"></div>
        </div>

        <div class="bizcard-face bizcard-back">
          <div class="bc-gloss" aria-hidden="true"></div>
        </div>

      </div>
    </div>

    <!-- ===== Quick actions ===== -->
    <div class="carte-actions">
      <button class="action-btn" id="c-flip"><span id="c-flip-label">Retourner la carte</span></button>
      <a class="contact-pill" href="tel:+213549880519">📞 +213 5 49 88 05 19</a>
      <a class="contact-pill" href="mailto:azro.mobilier@gmail.com">✉ azro.mobilier@gmail.com</a>
      <a class="action-btn" id="c-img" href="carte-azro-mobilier.jpeg" download="carte-azro-mobilier.jpeg"><span id="c-img-label">Image JPEG</span></a>
      <a class="action-btn primary" id="c-pdf" href="Carte visite SARL Azro Mobiler.pdf" target="_blank" rel="noopener"><span id="c-pdf-label">PDF original</span></a>
    </div>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> Azro Mobilier — <span data-i18n="footer">Tous droits réservés</span></p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/carte.js"></script>
</body>
</html>
