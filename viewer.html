<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azro Mobilier — Visionneuse</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="viewer-page">
  <div class="wood-bg" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="viewer-bar">
    <a href="index.html" class="back-btn">
      <span class="back-arrow">←</span>
      <span data-i18n="back">Retour</span>
    </a>
    <div class="viewer-title-wrap">
      <h1 class="viewer-title" id="viewerTitle">Document</h1>
      <p class="viewer-sub" id="viewerSub">Azro Mobilier</p>
    </div>
    <div class="viewer-actions">
      <div class="zoom-controls" aria-label="Zoom">
        <button class="zoom-btn" id="zoomOut" title="Zoom -">−</button>
        <span class="zoom-level" id="zoomLevel">100%</span>
        <button class="zoom-btn" id="zoomIn" title="Zoom +">+</button>
      </div>
      <a id="downloadLink" class="action-btn primary" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span data-i18n="download">Télécharger</span>
      </a>
      <a id="openLink" class="action-btn" target="_blank" rel="noopener" title="Ouvrir dans un nouvel onglet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </a>
    </div>
  </header>

  <main class="viewer-main">
    <div class="pdf-container" id="pdfContainer">
      <div class="pdf-loader" id="pdfLoader">
        <div class="loader-spinner"></div>
        <p data-i18n="loading">Chargement du document…</p>
        <div class="progress-wrap" id="progressWrap" hidden>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <span class="progress-text" id="progressText">0 / 0</span>
        </div>
      </div>
      <div class="pdf-pages" id="pdfPages"></div>
      <iframe class="pdf-native" id="pdfNative" title="PDF" allow="fullscreen" hidden></iframe>
      <div class="pdf-error" id="pdfError" hidden>
        <p class="error-title">⚠️ <span data-i18n="err_title">Impossible de charger le document</span></p>
        <p class="error-msg" data-i18n="err_msg">Veuillez ouvrir le site via un serveur local (http://localhost) plutôt qu'en double-cliquant le fichier.</p>
        <a id="errorOpenLink" class="action-btn primary" target="_blank" rel="noopener">
          <span data-i18n="new_tab">Nouvel onglet</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Floating download FAB -->
  <a id="fabDownload" class="fab-download" download title="Télécharger le PDF" aria-label="Télécharger">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    <span class="fab-label" data-i18n="download">Télécharger</span>
  </a>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
